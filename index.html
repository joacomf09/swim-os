<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/dm-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
/* Layout: single mobile column (max 560px), bottom tab bar, full-screen training overlay. Dark-only pool-at-night identity. */
:root{
  --bg:#040A18; --surface:#0A1530; --surface-2:#10204A; --line:#1B2D5A; --line-2:#26407A;
  --ink:#EEF4FF; --muted:#8C9DC6; --dim:#5B6C96;
  --electric:#3A7BFF; --aqua:#25E2D2; --ice:#CFE0FF; --warn:#FFC24A; --danger:#FF5E7E;
  --sky:#0A1734; --fig-ink:#EEF4FF;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
button{touch-action:manipulation}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1;display:flex;align-items:center;gap:8px}
.mark i{font-style:normal;color:var(--aqua)}
.mark svg{width:26px;height:26px}
.date{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}

.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(58,123,255,.28),transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--electric) 0 14px,var(--ice) 14px 28px,var(--aqua) 28px 42px,var(--ice) 42px 56px);opacity:.55}
.bigm{font-family:var(--f-display);font-weight:800;font-size:76px;line-height:.9;letter-spacing:-.01em}
.bigm small{font-size:30px;font-weight:600;color:var(--aqua);margin-left:6px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.05}
.meta span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);min-width:64px}
.seg button[aria-pressed="true"]{background:var(--electric);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px;background:var(--bg)}
.stack span{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.legend div{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.legend b{font-family:var(--f-display);font-size:22px;font-weight:700}
.legend span{font-size:12px;color:var(--muted)}

.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:4px}
.block-h h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.block-h h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.block-h span{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:17px}
.exl{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.exl li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px;border-radius:var(--r-sm);background:var(--bg)}
.exl .thumb{width:64px;height:40px;border-radius:8px;overflow:hidden}
.exl .thumb svg{width:100%;height:100%;display:block}
.exl .nm{font-weight:600;font-size:14px;line-height:1.25}
.exl .sub{font-size:12px;color:var(--muted)}
.exl .qty{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}

.cta-wrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:linear-gradient(180deg,transparent,var(--bg) 40%);z-index:5}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:528px;margin:0 auto;min-height:62px;border-radius:999px;background:linear-gradient(90deg,var(--electric),#2C9BFF 60%,var(--aqua));color:#031027;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.08em;box-shadow:0 10px 30px rgba(58,123,255,.35)}
.cta svg{width:22px;height:22px}
.cta:active{transform:scale(.98)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(6,13,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:64px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.04em}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--aqua)}

/* Editor */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ed{border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);overflow:hidden}
.ed-h{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.ed-h .idx{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.ed-h .nm{font-weight:600;font-size:14px}
.ed-h .sub{font-size:12px;color:var(--muted)}
.ed-h .qty{font-family:var(--f-display);font-weight:700;font-size:20px}
.ed-b{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
.btn.danger{color:var(--danger);border-color:rgba(255,94,126,.4)}
.btn.primary{background:var(--electric);border-color:var(--electric);color:#fff}
.btn.big{min-height:56px;font-family:var(--f-display);font-size:20px;letter-spacing:.08em;font-weight:800;width:100%}
.btn:disabled{opacity:.35}
.note{border-radius:var(--r-md);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.note.ok{background:rgba(37,226,210,.1);border:1px solid rgba(37,226,210,.35)}
.note.bad{background:rgba(255,194,74,.08);border:1px solid rgba(255,194,74,.4)}
.note ul{margin:0;padding-left:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--surface-2);border:1px solid var(--line-2)}
.chip.ok{color:var(--aqua);border-color:rgba(37,226,210,.4)}
.chip.warn{color:var(--warn);border-color:rgba(255,194,74,.4)}

/* Training overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-in{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted)}
.clock b{color:var(--ink)}
.ghost{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:14px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.prog .row span{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--electric),var(--aqua));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.active{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.active .pic svg{display:block;width:100%;height:auto}
.active .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.ex-name{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts b{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.facts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.timer{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.01em}
.timer .t small{font-size:44px;color:var(--muted)}
.timer .l{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.timer.paused .t{color:var(--warn)}
.ring{position:relative;width:210px;height:210px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.95}
.ring .c span{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.go .ring .c b,.go .ring .c span{color:var(--aqua)}
.go .ring{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.main-btn{width:100%;min-height:84px;border-radius:24px;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px}
.main-btn svg{width:30px;height:30px}
.main-btn.start{background:linear-gradient(90deg,var(--electric),var(--aqua));color:#031027}
.main-btn.finish{background:var(--ink);color:#031027}
.main-btn.resume{background:var(--warn);color:#2A1A00}
.main-btn:active{transform:scale(.985)}
.sec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sec button{min-height:60px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;letter-spacing:.04em}
.sec button svg{width:22px;height:22px}
.sec button:disabled{opacity:.3}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
details.more summary{list-style:none;padding:14px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(180deg)}
details.more summary svg{width:18px;height:18px;transition:transform .2s}
details.more .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
details.more ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.bp{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.bp .bar{height:8px}
.bp .v{text-align:right;color:var(--muted)}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:rgba(255,94,126,.1);border:1px solid rgba(255,94,126,.4);font-weight:600;font-size:14px;flex-wrap:wrap}
.confirm div{display:flex;gap:8px}
.safety{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.safety svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--aqua)}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hl{grid-column:1/-1;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.kpi.hl b{font-size:64px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.hist .d{font-weight:600;font-size:14px}
.hist .chip{justify-self:end}
.hist .s{font-size:12px;color:var(--muted)}
.hist .m{font-family:var(--f-display);font-weight:800;font-size:26px;text-align:right;line-height:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-md);font-size:14px}
.muted{color:var(--muted)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{font-size:13px;color:var(--aqua)}
.msg.err{color:var(--warn)}
@media (max-width:380px){.bigm{font-size:64px}.timer .t{font-size:80px}.facts b{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
const {useState,useEffect,useRef,useMemo}=React;
const html=htm.bind(React.createElement);

/* ---------- data ---------- */
const BLOCKS={
  w:{name:'Calentamiento',color:'var(--aqua)'},
  t:{name:'Técnica y velocidad',color:'var(--electric)'},
  r:{name:'Resistencia',color:'var(--ice)'}
};
const TYPES={
  crol:{label:'Crol',style:'Crol'},
  pull:{label:'Brazos con pull buoy',style:'Brazos'},
  kick:{label:'Pataleo de crol con tabla',style:'Patada'},
  breast:{label:'Patada de rana con tabla',style:'Patada'},
  dolphin:{label:'Patada de delfín boca arriba',style:'Patada'},
  sprint:{label:'Sprint de crol',style:'Crol'},
  endurance:{label:'Crol de resistencia',style:'Crol'}
};
const DEFAULT={target:1500,pool:25,exercises:[
 {id:'e1',block:'w',type:'crol',name:'Crol suave',reps:1,dist:100,intensity:'3/10',rest:15,goal:'Activar el sistema cardiovascular.',tips:['Brazada larga y relajada.','Respira cada 3 brazadas.','Mirada al fondo, cadera alta.']},
 {id:'e2',block:'w',type:'pull',name:'Solo brazos con pull buoy',reps:1,dist:100,intensity:'4/10',rest:20,goal:'Mejorar la tracción y la técnica de brazada.',tips:['Pull buoy entre los muslos, piernas quietas.','Codo alto en la tracción.','Empuja el agua hasta la cadera.']},
 {id:'e3',block:'w',type:'kick',name:'Pataleo de crol con tabla',reps:2,dist:50,intensity:'4/10',rest:15,goal:'Activar piernas y mejorar la posición corporal.',tips:['Patada desde la cadera, no desde la rodilla.','Tobillos sueltos, pies en punta.','Brazos extendidos sobre la tabla.']},
 {id:'e4',block:'t',type:'breast',name:'Patada de rana con tabla',reps:2,dist:50,intensity:'5/10',rest:20,goal:'Coordinar la patada de braza.',tips:['Recoge talones hacia los glúteos.','Pies en flexión hacia fuera.','Cierra con un latigazo y desliza.']},

const clone=o=>JSON.parse(JSON.stringify(o));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

};
const fmtM=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const pad=n=>String(n).padStart(2,'0');
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${pad(m)}:${pad(s%60)}`:`${m}:${pad(s%60)}`}
const tenth=ms=>Math.floor(Math.max(0,ms)%1000/100);
function laps(dist,pool){const n=dist/pool;return Number.isInteger(n)?String(n):String(Math.round(n*10)/10).replace('.',',')}
const lapWord=(d,p)=>{const n=d/p;return n===1?'largo':'largos'};
function totals(w){
  let total=0,sets=0,rest=0;const by={w:0,t:0,r:0};
  w.exercises.forEach(e=>{const m=e.reps*e.dist;total+=m;by[e.block]=(by[e.block]||0)+m;sets+=e.reps;rest+=e.reps*e.rest});
  const min=Math.round((total/100*120+rest)/60),max=Math.round((total/100*165+rest)/60);
  return{total,by,sets,rest,min,max};
}
function sanitize(w){
  if(!w||!Array.isArray(w.exercises))return null;
  const ex=w.exercises.filter(e=>e&&e.id).map(e=>({...e,
    reps:Math.max(1,Math.round(+e.reps||1)),dist:Math.max(5,Math.round(+e.dist||25)),
    rest:Math.max(0,Math.round(+e.rest||0)),type:TYPES[e.type]?e.type:'crol',block:BLOCKS[e.block]?e.block:'r',
    name:String(e.name||'Ejercicio'),intensity:String(e.intensity||''),tips:Array.isArray(e.tips)?e.tips:[],goal:String(e.goal||'')}));
  return{target:Math.max(25,Math.round(+w.target||1500)),pool:+w.pool===50?50:25,exercises:ex};
}
function validate(w){
  const t=totals(w),issues=[];
  if(!w.exercises.length)issues.push('La rutina no tiene ejercicios.');
  if(t.total!==w.target)issues.push(`La suma es ${fmtM(t.total)} m y el objetivo ${fmtM(w.target)} m (${t.total>w.target?'+':'−'}${fmtM(Math.abs(t.total-w.target))} m).`);
  w.exercises.forEach((e,i)=>{if(e.dist%w.pool!==0)issues.push(`Ejercicio ${i+1} (${e.name}): ${e.dist} m no es múltiplo de la piscina de ${w.pool} m.`)});
  return{t,issues};
}

    <div className="kpis">
      <div className="kpi"><b className="num">${history.length}</b><span>sesiones guardadas</span></div>
      <div className="kpi"><b className="num">${(tot/1000).toFixed(1).replace('.',',')} km</b><span>nadados en total</span></div>
      <div className="kpi hl" style=${{gridColumn:'1/-1'}}><b className="num" style=${{fontSize:'44px'}}>${best?fmt(best):'—'}</b><span>mejor ritmo medio /100 m</span></div>
    </div>
    ${history.length
      ?html`<ul className="hist">${history.map(h=>html`<li key=${h.id}>
          <span className="d">${dateLong(h.date)}</span><span className="m num">${fmtM(h.meters)} m</span>
          <span className="s num">${fmt(h.total)} total · ${h.pace?fmt(h.pace)+' /100 m':'sin ritmo'} · piscina ${h.pool} m</span>
          <span className=${'chip num '+(h.compliance>=100?'ok':'warn')}>${h.compliance} %</span></li>`)}</ul>`
      :html`<div className="empty">Aún no hay sesiones. Termina un entrenamiento y pulsa “Guardar en historial”.</div>`}
    ${history.length>0&&(confirm
      ?html`<div className="confirm"><span>¿Borrar todo el historial?</span><div><button className="btn" onClick=${()=>setConfirm(false)}>No</button><button className="btn danger" onClick=${()=>{setHistory([]);setConfirm(false)}}>Borrar</button></div></div>`
      :html`<button className="btn danger" onClick=${()=>setConfirm(true)}><${Icon} n="trash"/>Borrar historial</button>`)}
    <section className="card"><h2>Copia de seguridad</h2>
      <p className="muted" style=${{margin:0,fontSize:'13px'}}>Rutina e historial viven en este dispositivo. Exporta una copia de vez en cuando o antes de cambiar de móvil.</p>
      <div className="tools">
        <button className="btn" onClick=${exportData}><${Icon} n="download"/>Exportar copia</button>
        <label className="btn file-btn"><${Icon} n="upload"/>Importar copia<input id="import-file" type="file" accept="application/json,.json" onChange=${importData}/></label>
      </div>
      ${msg&&html`<div className=${'msg'+(msg.err?' err':'')} role="status">${msg.t}</div>`}
    </section>
  <//>`;
}

/* ---------- active training ---------- */
function blockProgress(sess){
  const res={};
  Object.keys(BLOCKS).forEach(k=>res[k]={done:0,plan:0});
  sess.plan.forEach(e=>res[e.block].plan+=e.reps*e.dist);
  sess.log.forEach(l=>res[l.block].done+=l.dist);
  return res;
}
function Training({sess,act}){
  const [confirmEnd,setConfirmEnd]=useState(false);
  const now=Date.now();
  const e=sess.plan[sess.ex];
  const pool=sess.pool;
  const planned=sess.plan.reduce((a,x)=>a+x.reps*x.dist,0);
  const done=sess.log.reduce((a,l)=>a+l.dist,0);
  const setMs=sess.phase==='swim'?sess.setAcc+now-sess.setStart:sess.setAcc;
  const restLeft=sess.restEnd-now;
  const restTotal=Math.max(1,sess.restEnd-sess.restStart);
  const go=sess.phase==='rest'&&restLeft<=0;
  const next=sess.rep+1<e.reps?`Serie ${sess.rep+2} de ${e.reps} · ${e.dist} m`:(sess.plan[sess.ex+1]?`${sess.plan[sess.ex+1].name} · ${sess.plan[sess.ex+1].reps}×${sess.plan[sess.ex+1].dist} m`:'Fin del entrenamiento');
  const bp=blockProgress(sess);
  const R=92,C=2*Math.PI*R;
  const restFrac=sess.phase==='rest'?Math.max(0,Math.min(1,restLeft/restTotal)):0;

  let timer;
  if(sess.phase==='rest'){
    timer=html`<div className=${'timer'+(go?' go':'')}><div className="ring">
      <svg viewBox="0 0 210 210" aria-hidden="true"><circle cx="105" cy="105" r=${R} fill="none" stroke="var(--surface-2)" strokeWidth="12"/>
      <circle cx="105" cy="105" r=${R} fill="none" stroke=${go?'var(--aqua)':'var(--electric)'} strokeWidth="12" strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C*(1-restFrac)} style=${{transition:'stroke-dashoffset .25s linear'}}/></svg>
      <div className="c"><b className="num">${go?'¡YA!':Math.ceil(restLeft/1000)}</b><span>${go?'Descanso cumplido':'Descanso · s'}</span></div></div></div>`;
  }else if(sess.phase==='ready'){
    timer=html`<div className="timer"><div className="t num">${e.dist}<small> m</small></div><div className="l">Listo para la serie ${sess.rep+1}</div></div>`;
  }else{
    timer=html`<div className=${'timer'+(sess.phase==='paused'?' paused':'')}><div className="t num">${fmt(setMs)}<small>.${tenth(setMs)}</small></div><div className="l">${sess.phase==='paused'?'En pausa':'Tiempo de serie'}</div></div>`;
  }

  let main,mid;
  if(sess.phase==='swim'){main=html`<button className="main-btn finish" onClick=${act.finish}><${Icon} n="check"/>FINALIZAR SERIE</button>`;mid=html`<button onClick=${act.pause}><${Icon} n="pause"/>Pausar</button>`}
  else if(sess.phase==='paused'){main=html`<button className="main-btn resume" onClick=${act.resume}><${Icon} n="play"/>REANUDAR</button>`;mid=html`<button onClick=${act.finish}><${Icon} n="check"/>Finalizar</button>`}
  else if(sess.phase==='rest'){main=html`<button className="main-btn start" onClick=${act.startSet}><${Icon} n="play"/>INICIAR SERIE</button>`;mid=html`<button onClick=${act.addRest}><${Icon} n="plus"/>+15 s</button>`}
  else{main=html`<button className="main-btn start" onClick=${act.startSet}><${Icon} n="play"/>INICIAR SERIE</button>`;mid=html`<button onClick=${act.rest}><${Icon} n="rest"/>Descanso</button>`}

  return html`<div className="ov" role="dialog" aria-label="Entrenamiento activo"><div className="ov-in">
    <div className="ov-top">
      <span className="chip" style=${{color:BLOCKS[e.block].color}}>${BLOCKS[e.block].name}</span>
      <span className="clock num">Total <b>${fmt(now-sess.startedAt)}</b></span>
      <button className="ghost" onClick=${()=>setConfirmEnd(true)}>Terminar</button>
    </div>
    ${confirmEnd&&html`<div className="confirm"><span>¿Terminar el entrenamiento ahora?</span><div><button className="btn" onClick=${()=>setConfirmEnd(false)}>Seguir</button><button className="btn danger" onClick=${act.end}>Terminar</button></div></div>`}
    <div className="prog">
      <div className="row"><b className="num">${fmtM(done)} <span style=${{fontSize:'16px'}}>/ ${fmtM(planned)} m</span></b><span className="num">${sess.log.length} de ${sess.plan.reduce((a,x)=>a+x.reps,0)} series</span></div>
      <div className="bar" role="progressbar" aria-valuenow=${done} aria-valuemin="0" aria-valuemax=${planned}><span style=${{width:(planned?done/planned*100:0)+'%'}}></span></div>
    </div>
    <article className="active">
      <div className="pic"><${Fig} type=${e.type}/></div>
      <div className="body">
        <div className="eyebrow">Ejercicio ${sess.ex+1} de ${sess.plan.length}</div>
        <div className="ex-name">${e.name}</div>
        <div className="facts">
          <div><b className="num">${sess.rep+1}/${e.reps}</b><span>Serie</span></div>
          <div><b className="num">${e.dist} m</b><span>Distancia</span></div>
          <div><b className="num">${laps(e.dist,pool)}</b><span>${lapWord(e.dist,pool)}</span></div>
          <div><b>${e.intensity}</b><span>Intensidad</span></div>
        </div>
        ${timer}
      </div>
    </article>
    ${main}
    <div className="sec">
      <button onClick=${act.prev} disabled=${sess.ex===0&&sess.rep===0}><${Icon} n="prev"/>Anterior</button>
      ${mid}
      <button onClick=${act.skip}><${Icon} n="next"/>Saltar</button>
    </div>
    <details className="more"><summary>Técnica y detalles<${Icon} n="down"/></summary><div className="in">
      ${e.goal&&html`<div><div className="eyebrow">Objetivo</div><div>${e.goal}</div></div>`}
      ${e.tips&&e.tips.length>0&&html`<div><div className="eyebrow">Claves técnicas</div><ul>${e.tips.map((t,i)=>html`<li key=${i}>${t}</li>`)}</ul></div>`}
      <div className="grid2"><div><div className="eyebrow">Descanso recomendado</div><div className="num">${e.rest} s</div></div><div><div className="eyebrow">Siguiente</div><div>${next}</div></div></div>
      <div style=${{display:'flex',flexDirection:'column',gap:'8px'}}><div className="eyebrow">Progreso por bloque</div>
        ${Object.keys(BLOCKS).filter(k=>bp[k].plan).map(k=>html`<div className="bp" key=${k}><span>${BLOCKS[k].name}</span><div className="bar"><span style=${{width:(bp[k].done/bp[k].plan*100)+'%',background:BLOCKS[k].color}}></span></div><span className="v num">${bp[k].done}/${bp[k].plan}</span></div>`)}
      </div>
      <div className="safety"><${Icon} n="shield"/><span>Sin apnea ni hiperventilación. Respira con normalidad en todos los ejercicios, también en la patada de delfín.</span></div>
    </div></details>
  </div></div>`;
}

/* ---------- summary ---------- */
function summarize(sess){
  const meters=sess.log.reduce((a,l)=>a+l.dist,0);
  const active=sess.log.reduce((a,l)=>a+l.t,0);
  const total=sess.endedAt-sess.startedAt;
  const planned=sess.plan.reduce((a,x)=>a+x.reps*x.dist,0);
  const plannedSets=sess.plan.reduce((a,x)=>a+x.reps,0);
  const styles={};sess.log.forEach(l=>{const s=TYPES[l.type].style;styles[s]=(styles[s]||0)+l.dist});
  const enough=meters>0&&active>=10000;
  return{meters,active,rest:sess.restAcc,total,planned,plannedSets,sets:sess.log.length,styles,
    speed:enough?meters/(active/1000):null,pace:enough?active/meters*100:null,compliance:planned?Math.round(meters/planned*100):0};
}
function SpeedChart({log}){
  const data=log.map(l=>({v:l.t>0?l.dist/(l.t/1000):0,b:l.block,name:l.name}));
  const W=340,H=170,L=34,B=24,T=10;
  const max=Math.max(0.5,Math.ceil(Math.max(...data.map(d=>d.v),0)*4)/4);
  const ticks=[0,max/2,max];
  const bw=(W-L-6)/Math.max(1,data.length);
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Velocidad por serie en metros por segundo">
    ${ticks.map((t,i)=>{const y=H-B-(t/max)*(H-B-T);return html`<g key=${i}><line x1=${L} x2=${W} y1=${y} y2=${y} stroke="var(--line)" strokeWidth="1"/><text x=${L-6} y=${y+4} textAnchor="end">${t.toFixed(2).replace('.',',')}</text></g>`})}
    ${data.map((d,i)=>{const h=(d.v/max)*(H-B-T);return html`<g key=${i}><rect x=${L+i*bw+bw*.15} y=${H-B-h} width=${bw*.7} height=${Math.max(0,h)} rx="3" fill=${BLOCKS[d.b].color}><title>${`${d.name}: ${d.v.toFixed(2)} m/s`}</title></rect>${(data.length<=20||i%2===0)&&html`<text x=${L+i*bw+bw/2} y=${H-6} textAnchor="middle">${i+1}</text>`}</g>`})}
  </svg>`;
}
function Summary({sess,onSave,saved,onClose}){
  const s=useMemo(()=>summarize(sess),[sess]);
  const styleKeys=Object.keys(s.styles);
  const styleColor={Crol:'var(--electric)',Brazos:'var(--warn)',Patada:'var(--aqua)'};
  return html`<div className="ov" role="dialog" aria-label="Resumen del entrenamiento"><div className="ov-in">
    <div className="ov-top"><span className="mark"><${Logo}/>SWIM <i>OS</i></span><button className="ghost" onClick=${onClose}>Cerrar</button></div>
    <div><div className="eyebrow">Sesión completada · ${dateLong(sess.startedAt)}</div><h2 style=${{fontSize:'30px'}}>Resumen</h2></div>
    <div className="kpis">
      <div className="kpi hl"><b className="num">${fmtM(s.meters)} m</b><span>de ${fmtM(s.planned)} m planificados · ${s.compliance} % de cumplimiento</span></div>
      <div className="kpi"><b className="num">${fmt(s.total)}</b><span>Tiempo total</span></div>
      <div className="kpi"><b className="num">${fmt(s.active)}</b><span>Tiempo activo</span></div>
      <div className="kpi"><b className="num">${fmt(s.rest)}</b><span>Tiempo de descanso</span></div>
      <div className="kpi"><b className="num">${s.sets}/${s.plannedSets}</b><span>Series completadas</span></div>
      <div className="kpi"><b className="num">${s.pace?fmt(s.pace):'—'}</b><span>Ritmo medio /100 m</span></div>
      <div className="kpi"><b className="num">${s.speed?s.speed.toFixed(2).replace('.',','):'—'}</b><span>Velocidad media m/s</span></div>
    </div>
    ${!s.pace&&html`<p className="muted" style=${{margin:0,fontSize:'13px'}}>Ritmo y velocidad aparecen cuando hay al menos 10 s de nado registrado.</p>`}
    <section className="card"><div className="row"><h2>Velocidad por serie</h2><span className="muted" style=${{fontSize:'12px'}}>m/s</span></div>
      ${sess.log.length?html`<${SpeedChart} log=${sess.log}/>`:html`<div className="empty">No se registraron series.</div>`}
      <div className="legend">${Object.keys(BLOCKS).map(k=>html`<div key=${k}><span><i style=${{background:BLOCKS[k].color}}></i>${BLOCKS[k].name}</span></div>`)}</div>
    </section>
    <section className="card"><h2>Distribución de estilos</h2>
      ${styleKeys.length?html`<${React.Fragment}>
        <div className="stack">${styleKeys.map(k=>html`<span key=${k} style=${{width:(s.styles[k]/s.meters*100)+'%',background:styleColor[k]}}></span>`)}</div>
        <div className="legend">${styleKeys.map(k=>html`<div key=${k}><span><i style=${{background:styleColor[k]}}></i>${k}</span><b className="num">${fmtM(s.styles[k])} m</b><span className="num">${Math.round(s.styles[k]/s.meters*100)} %</span></div>`)}</div>
      <//>`:html`<div className="empty">Sin metros registrados.</div>`}
    </section>
    <button className="btn primary big" onClick=${()=>onSave(s)} disabled=${saved||!s.sets}>${saved?'GUARDADO EN HISTORIAL':'GUARDAR EN HISTORIAL'}</button>
    <button className="btn" onClick=${onClose}>Volver al inicio</button>
  </div></div>`;
}

/* ---------- app ---------- */
function App(){
  const [w,setW]=useState(()=>sanitize(store.get('swimos.workout',null))||clone(DEFAULT));
  const [history,setHistory]=useState(()=>{const h=store.get('swimos.history',[]);return Array.isArray(h)?h:[]});
  const [tab,setTab]=useState('hoy');
  const [sess,setSess]=useState(null);
  const [saved,setSaved]=useState(false);
  const [,tick]=useState(0);
  const wake=useRef(null),buzzed=useRef(false);

  useEffect(()=>{store.set('swimos.workout',w)},[w]);
  useEffect(()=>{store.set('swimos.history',history)},[history]);
  const live=sess&&sess.phase!=='done';
  useEffect(()=>{if(!live)return;const id=setInterval(()=>tick(x=>x+1),200);return()=>clearInterval(id)},[live]);
  useEffect(()=>{
    if(live){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{wake.current=l}).catch(()=>{})}catch(e){}}
    else if(wake.current){try{wake.current.release()}catch(e){}wake.current=null}
  },[live]);
  // vibrate once when rest ends
  if(sess&&sess.phase==='rest'){if(Date.now()>=sess.restEnd&&!buzzed.current){buzzed.current=true;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
  else buzzed.current=false;

  const start=()=>{const s=sanitize(w);setSaved(false);setSess({plan:s.exercises,pool:s.pool,startedAt:Date.now(),ex:0,rep:0,phase:'ready',setStart:0,setAcc:0,restStart:0,restEnd:0,restAcc:0,log:[],endedAt:null})};
  const closeRest=(s,now)=>s.phase==='rest'?s.restAcc+(now-s.restStart):s.restAcc;
  const nextPtr=(plan,ex,rep)=>rep+1<plan[ex].reps?{ex,rep:rep+1}:ex+1<plan.length?{ex:ex+1,rep:0}:null;
  const act={
    startSet:()=>setSess(s=>{const n=Date.now();return{...s,restAcc:closeRest(s,n),phase:'swim',setStart:n,setAcc:0}}),
    pause:()=>setSess(s=>{const n=Date.now();return{...s,phase:'paused',setAcc:s.setAcc+n-s.setStart}}),
    resume:()=>setSess(s=>({...s,phase:'swim',setStart:Date.now()})),
    finish:()=>setSess(s=>{const n=Date.now(),e=s.plan[s.ex],t=s.setAcc+(s.phase==='swim'?n-s.setStart:0),key=e.id+'#'+s.rep;
      const log=s.log.filter(l=>l.key!==key).concat([{key,name:e.name,type:e.type,block:e.block,dist:e.dist,t}]);
      const np=nextPtr(s.plan,s.ex,s.rep);
      if(!np)return{...s,log,phase:'done',endedAt:n,setAcc:0};
      return{...s,log,ex:np.ex,rep:np.rep,phase:'rest',restStart:n,restEnd:n+e.rest*1000,setAcc:0}}),
    rest:()=>setSess(s=>{const n=Date.now(),r=Math.max(15,s.plan[s.ex].rest);return{...s,phase:'rest',restStart:n,restEnd:n+r*1000}}),
    addRest:()=>setSess(s=>({...s,restEnd:Math.max(s.restEnd,Date.now())+15000})),
    skip:()=>setSess(s=>{const n=Date.now(),ra=closeRest(s,n);if(s.ex+1>=s.plan.length)return{...s,restAcc:ra,phase:'done',endedAt:n};return{...s,restAcc:ra,ex:s.ex+1,rep:0,phase:'ready',setAcc:0}}),
    prev:()=>setSess(s=>{const n=Date.now(),ra=closeRest(s,n);return{...s,restAcc:ra,ex:s.rep>0?s.ex:Math.max(0,s.ex-1),rep:0,phase:'ready',setAcc:0}}),
    end:()=>setSess(s=>{const n=Date.now();return{...s,restAcc:closeRest(s,n),phase:'done',endedAt:n}})
  };
  const save=s=>{setHistory(h=>[{id:sess.startedAt,date:sess.startedAt,meters:s.meters,total:s.total,active:s.active,rest:s.rest,pace:s.pace,sets:s.sets,compliance:s.compliance,pool:sess.pool}].concat(h.filter(x=>x.id!==sess.startedAt)).slice(0,500));setSaved(true)};

  const importAll=d=>{
    if(!d||d.app!=='swim-os')throw new Error('bad');
    const parts=[];
    if(Array.isArray(d.history)){const valid=d.history.filter(h=>h&&h.id&&typeof h.meters==='number');
      setHistory(h=>{const m=new Map(h.map(x=>[x.id,x]));valid.forEach(x=>m.set(x.id,x));return [...m.values()].sort((a,b)=>b.date-a.date).slice(0,500)});
      parts.push(valid.length+' sesiones')}
    const sw=sanitize(d.workout);if(sw){setW(sw);parts.push('la rutina')}
    if(!parts.length)throw new Error('empty');
    return 'Importado: '+parts.join(' y ')+'.';
  };
  const today=cap(new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
  return html`<${React.Fragment}>
    <main className="app">
      <header className="top"><span className="mark"><${Logo}/>SWIM <i>OS</i></span><span className="date">${today}</span></header>
      ${tab==='hoy'&&html`<${Dashboard} w=${w} setPool=${p=>setW(x=>({...x,pool:p}))} onStart=${start}/>`}
      ${tab==='rutina'&&html`<${Editor} w=${w} setW=${setW}/>`}
      ${tab==='hist'&&html`<${History} history=${history} setHistory=${setHistory} onImport=${importAll}/>`}
    </main>
    <div className="tabs"><nav aria-label="Secciones">
      ${[['hoy','home','Hoy'],['rutina','list','Rutina'],['hist','hist','Historial']].map(([k,ic,l])=>html`<button key=${k} aria-current=${tab===k?'page':undefined} onClick=${()=>{setTab(k);window.scrollTo(0,0)}}><${Icon} n=${ic}/>${l}</button>`)}
    </nav></div>
    ${sess&&sess.phase!=='done'&&html`<${Training} sess=${sess} act=${act}/>`}
    ${sess&&sess.phase==='done'&&html`<${Summary} sess=${sess} saved=${saved} onSave=${save} onClose=${()=>{setSess(null);setTab(saved?'hist':'hoy')}}/>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
